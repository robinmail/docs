<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <title id="t">A robinmail cluster</title>
  <desc id="d">Three nodes. Each node is one robinmail process with its own SQLite database, its Raft log and its blob files on its own disk. The nodes send each other Raft messages, snapshots and blob files over mutual TLS, pinned to the certificates of the Raft members. No node has a database port.</desc>
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #e8eefc; stroke: #2b4c9b; stroke-width: 2; }
    .db { fill: #eef8f0; stroke: #2f7a44; stroke-width: 1.5; }
    .bl { fill: #f4f6fa; stroke: #4a5568; stroke-width: 1.5; }
    .t { fill: #1a202c; }
    .s { fill: #4a5568; font-size: 12px; }
    .h { font-weight: 600; }
    .lb { stroke: #2b4c9b; stroke-width: 1.5; fill: none; }
  </style>
  <rect class="bg" width="760" height="360" rx="10"/>

  <g>
    <rect class="node" x="20" y="50" width="210" height="220" rx="8"/>
    <text class="t h" x="125" y="78" text-anchor="middle">robinmail, node a</text>
    <rect class="db" x="40" y="96" width="170" height="70" rx="6"/>
    <text class="t h" x="125" y="122" text-anchor="middle">database</text>
    <text class="s" x="125" y="142" text-anchor="middle">data.db and raft.db</text>
    <text class="s" x="125" y="158" text-anchor="middle">in data_dir/db</text>
    <rect class="bl" x="40" y="180" width="170" height="70" rx="6"/>
    <text class="t h" x="125" y="206" text-anchor="middle">blob files</text>
    <text class="s" x="125" y="226" text-anchor="middle">encrypted, every message</text>
    <text class="s" x="125" y="242" text-anchor="middle">in data_dir/blobs</text>
  </g>
  <g>
    <rect class="node" x="275" y="50" width="210" height="220" rx="8"/>
    <text class="t h" x="380" y="78" text-anchor="middle">robinmail, node b</text>
    <rect class="db" x="295" y="96" width="170" height="70" rx="6"/>
    <text class="t h" x="380" y="122" text-anchor="middle">database</text>
    <text class="s" x="380" y="142" text-anchor="middle">data.db and raft.db</text>
    <text class="s" x="380" y="158" text-anchor="middle">in data_dir/db</text>
    <rect class="bl" x="295" y="180" width="170" height="70" rx="6"/>
    <text class="t h" x="380" y="206" text-anchor="middle">blob files</text>
    <text class="s" x="380" y="226" text-anchor="middle">encrypted, every message</text>
    <text class="s" x="380" y="242" text-anchor="middle">in data_dir/blobs</text>
  </g>
  <g>
    <rect class="node" x="530" y="50" width="210" height="220" rx="8"/>
    <text class="t h" x="635" y="78" text-anchor="middle">robinmail, node c</text>
    <rect class="db" x="550" y="96" width="170" height="70" rx="6"/>
    <text class="t h" x="635" y="122" text-anchor="middle">database</text>
    <text class="s" x="635" y="142" text-anchor="middle">data.db and raft.db</text>
    <text class="s" x="635" y="158" text-anchor="middle">in data_dir/db</text>
    <rect class="bl" x="550" y="180" width="170" height="70" rx="6"/>
    <text class="t h" x="635" y="206" text-anchor="middle">blob files</text>
    <text class="s" x="635" y="226" text-anchor="middle">encrypted, every message</text>
    <text class="s" x="635" y="242" text-anchor="middle">in data_dir/blobs</text>
  </g>

  <path class="lb" d="M230 160 H275"/>
  <path class="lb" d="M485 160 H530"/>
  <path class="lb" d="M125 50 V24 H635 V50"/>

  <line class="lb" x1="40" y1="310" x2="80" y2="310"/>
  <text class="t" x="90" y="315">port 7443: Raft messages, snapshots and blob copies, mutual TLS pinned to the members</text>
  <text class="s" x="90" y="338">No SQL on any port. A command on a node reaches its own server over loopback.</text>
</svg>
