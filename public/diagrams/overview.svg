<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <title id="t">robinmail: one binary</title>
  <desc id="d">Mail servers, mail programs and browsers connect to one robinmail binary on ports 25, 465 and 587, 993 and 143, and 443. robinmail keeps metadata in rqlite, message files encrypted on its own disk, and asks Rspamd about spam, SPF, DKIM and DMARC.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f4f6fa; stroke: #4a5568; stroke-width: 1.5; }
    .main { fill: #e8eefc; stroke: #2b4c9b; stroke-width: 2; }
    .t { fill: #1a202c; }
    .s { fill: #4a5568; font-size: 12px; }
    .l { stroke: #4a5568; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .h { font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="400" rx="10"/>

  <rect class="box" x="20" y="20" width="160" height="50" rx="6"/>
  <text class="t" x="100" y="50" text-anchor="middle">Other mail servers</text>
  <rect class="box" x="210" y="20" width="160" height="50" rx="6"/>
  <text class="t" x="290" y="50" text-anchor="middle">Mail programs</text>
  <rect class="box" x="400" y="20" width="160" height="50" rx="6"/>
  <text class="t" x="480" y="50" text-anchor="middle">Mail programs</text>
  <rect class="box" x="590" y="20" width="150" height="50" rx="6"/>
  <text class="t" x="665" y="50" text-anchor="middle">Browsers</text>

  <path class="l" d="M100 70 V140"/>
  <text class="s" x="108" y="110">SMTP 25</text>
  <path class="l" d="M290 70 V140"/>
  <text class="s" x="298" y="110">submission 465, 587</text>
  <path class="l" d="M480 70 V140"/>
  <text class="s" x="488" y="110">IMAP 993, 143</text>
  <path class="l" d="M665 70 V140"/>
  <text class="s" x="673" y="110">HTTPS 443</text>

  <rect class="main" x="20" y="140" width="720" height="110" rx="8"/>
  <text class="t h" x="380" y="168" text-anchor="middle">robinmail (one Go binary)</text>
  <text class="t" x="380" y="196" text-anchor="middle">inbound SMTP · submission · outbound queue · IMAP · JMAP · login · webmail</text>
  <text class="s" x="380" y="222" text-anchor="middle">delivery, Sieve, aliases and SRS, push, full-text search, blob copies, repair, scrub</text>

  <path class="l" d="M140 250 V320"/>
  <path class="l" d="M380 250 V320"/>
  <path class="l" d="M620 250 V320"/>

  <rect class="box" x="40" y="320" width="200" height="60" rx="6"/>
  <text class="t h" x="140" y="345" text-anchor="middle">rqlite</text>
  <text class="s" x="140" y="365" text-anchor="middle">all metadata, over HTTP</text>
  <rect class="box" x="280" y="320" width="200" height="60" rx="6"/>
  <text class="t h" x="380" y="345" text-anchor="middle">blob files</text>
  <text class="s" x="380" y="365" text-anchor="middle">encrypted, on the node's disk</text>
  <rect class="box" x="520" y="320" width="200" height="60" rx="6"/>
  <text class="t h" x="620" y="345" text-anchor="middle">Rspamd</text>
  <text class="s" x="620" y="365" text-anchor="middle">spam, SPF, DKIM, DMARC</text>
</svg>
